name: wsmart

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: wsmart:php84-apache
    container_name: wsmart-app

    restart: unless-stopped

    ports:
      - "8084:80"

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: wsmart-db

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - wsmart_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  wsmart_postgres_data:
    name: wsmart_postgres_data