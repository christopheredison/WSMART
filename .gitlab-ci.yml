    VPN_PORT: "8422"

  before_script:
    - echo "⚙️  Setup Environment..."
    # 1. Install OpenConnect (mendukung Fortinet) dan SSH Client
    - apt-get update -y && apt-get install -y openconnect openssh-client git

    # 2. Setup SSH Key (id_rsa)
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    # Matikan verifikasi host key agar tidak ditanya "Are you sure?"
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config

    # 3. KONEKSI KE FORTINET VPN (Port 8422)
    - echo "🔌 Menghubungkan ke Fortinet VPN..."

    # Penjelasan Command:
    # --protocol=fortinet : Wajib untuk FortiClient
    # --background : Jalan di latar belakang
    # --servercert : Mencegah error "Certificate untrusted".
    #                (Nanti saya jelaskan cara dapat hash-nya di bawah script ini)

    - echo "yes" | openconnect --protocol=fortinet "$VPN_ADDRESS:$VPN_PORT" --user="$VPN_USER" --passwd-on-stdin <<< "$VPN_PASSWORD" --background --no-cert-check || true
    - sleep 15
    - ip addr show
  script:
    - echo "🚀 Deploying ke Server ($SERVER_IP)..."
    - ssh $SERVER_USER@$SERVER_IP "
        echo '✅ Login Sukses!';
        cd /vhosts/rwi/https;
        echo '🔄 Git Pull EUT-DEV...';
        git fetch origin EUT-DEV;
        git reset --hard origin/EUT-DEV;
        echo '📦 Composer Install...';
        composer install --optimize-autoloader;
        echo '🗄️ Migrasi Database...';
        php artisan migrate --force;
        echo '🧹 Clear Cache...';
        php artisan optimize:clear;
        php artisan config:cache;
        php artisan route:cache;
        php artisan view:cache;
        echo '🎉 Deployment Selesai!';
      "
